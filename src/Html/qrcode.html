    <script>
        function generateQRCode() {
    const accNo = document.getElementById("accNo").value;
    const name = document.getElementById("name").value;
    const phone = document.getElementById("phone").value;

    // Validate input fields before proceeding
    const accNoPattern = /^[0-9]{9,18}$/;
    const namePattern = /^[A-Za-z\s]+$/;
    const phonePattern = /^[0-9]{10}$/;

    if (!accNoPattern.test(accNo)) {
        alert("Account number must be between 9 to 18 digits and contain only numbers.");
        return;
    }
    if (!namePattern.test(name)) {
        alert("Name must contain only characters.");
        return;
    }
    if (!phonePattern.test(phone)) {
        alert("Phone number must be exactly 10 digits and contain only numbers.");
        return;
    }

    // Generate QR Code
    const data = `accNo=${accNo}&name=${name}&phone=${phone}`;
    const qrCodeContainer = document.getElementById("qrcode");
    qrCodeContainer.innerHTML = ""; // Clear previous QR code
    new QRCode(qrCodeContainer, data);

    // Display modal
    const modal = document.getElementById("qrModal");
    modal.style.display = "block";
}


        function printQRCode() {
            const printContents = document.getElementById("qrcode").innerHTML;
            const originalContents = document.body.innerHTML;
            document.body.innerHTML = printContents;
            window.print();
            document.body.innerHTML = originalContents;
            location.reload();
        }

        function closeModal(){
            document.querySelector('.modal').style.display = 'none';
        }
    </script>
