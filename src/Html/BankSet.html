<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banks</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

        crossorigin="anonymous"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../Css/BankSet.css">
</head>
<body style="background-color:rgb(204, 224, 251);">
<header class="container-fluid mt-3">
    <div class="row"><nav class="navbar navbar-expand-lg ">
        <h1 class="navbar-brand ms-4 heading col-3 col-sm-3 col-md-3 col-lg-3">SimpliPay</h1>
        <button type="button" class="navbar-toggler me-4" data-bs-toggle="collapse" data-bs-target="#navbarnav"><span class="navbar-toggler-icon col-9 col-sm-9 col-md-9 col-lg-9"></span></button>
        <div class="collapse navbar-collapse" id="navbarnav">
            <ul class="navbar-nav text-center ms-auto me-5">
                <li class="nav-items">
                    <a class="nav-link active" href="Home.html">Home</a>
                </li>
                <li class="nav-items">
                    <a class="nav-link" href="qrcode.html">Generate</a>
                </li>
                <li class="nav-items">
                    <a class="nav-link" href="about.html">About us</a>
                </li>
                <li class="nav-items">
                    <a class="nav-link" href="contact.html">Contact</a>
                </li>
            </ul>
        </div>
    </nav>
</div>
</header>
<main class="m-5 container-fluid">
    <div class="row mt-5">
        <div class="col-12 col-sm-12 col-md-12 col-lg-5 border borders border-dark p-5 border-1 h-100 rounded-5">
            <h1 class="text-danger m-5 h1 text-center hello">Hello Staffs</h1>
            <div>
                <form>
                    <div class="form-group">
                        <label for="Name" class="form-label ms-2 ">Bank name</label><br>
                        <select id="bank" class="ms-2 p-2 w-100" aria-label="Default select example">
                            <option value="" selected>Select a Bank</option>
                            <option value="Indian">Indian Bank</option>
                            <option value="SBI">State Bank of India</option>
                            <option value="Tmb">Tamilnad Mercantile Bank</option>
                        </select>
                    </div><br>
                    <div class="form-group">
                        <label for="Voice" class="form-label ms-2 ">Language</label><br>
                        <select id="language" class="ms-2 p-2 w-100" aria-label="Default select example">
                            <option value="" selected>Select a Language</option>
                            <option value="Tamil">தமிழ்</option>
                            <option value="English">English</option>
                            <option value="Hindi">हिंदी</option>
                            <option value="Telugu">తెలుగు</option>
                            <option vlaue="Malayalam">മലയാളം</option>
                        </select>
                    </div><br>

                    <button id="proceedButton" type="submit" class="button bg-danger text-light p-3 rounded-3 border h6">Proceed</button>
                </form>
            </div>
        </div>
        <div class="col-12 col-sm-12 col-md-12 col-lg-7">
            <img src="../Images/Select.png" class="img-fluid">
        </div>
        <hr>    
    </div> 
</main>

<footer class="container-fluid">
    <div class="row">
        <div class="fs-5 mt-1 d-flex justify-content-center col-12 col-sm-12 col-md-12 col-lg-12">© 2024 SimpliPay.All Rights Reserved.</div>
        <div class="mt-4 d-flex justify-content-center ">
            <span class="fs-5 mt-2">Follow us :</span>
            <a href="https://linkedin.com" target="_blank" title="LinkedIn">
                <i class="fab fa-linkedin ms-2 mt-2 " style="font-size: 24px; color: #0077B5; margin-right: 10px;"></i>
            </a>
            <a href="https://twitter.com" target="_blank" title="Twitter">
                <i class="fab fa-facebook ms-2 mt-2" style="font-size: 24px; color: #4267B2;"></i>
            </a>
            <a href="https://twitter.com" target="_blank" title="Twitter">
                <i class="fab fa-twitter ms-4 mt-2" style="font-size: 24px; color: #1DA1F2;"></i>
            </a>
        </div>
    </div>
</footer>

<script>
    document.getElementById('proceedButton').addEventListener('click', (event) => {
        event.preventDefault();  // Prevent the form from submitting and reloading the page
        
        const bank = document.getElementById('bank').value.trim();
        const language = document.getElementById('language').value.trim();
        if (bank && language) {
            // Store the bank name in localStorage (optional)
            localStorage.setItem('selectedBank', bank);
            localStorage.setItem('selectedLanguage', language);
            alert("Thank you, Bank name and Language stored successfully");

            // Navigate to the QR scanner page with the bank parameter
            window.location.href = `qrscan.html?bank=${encodeURIComponent(bank)}&language=${encodeURIComponent(language)}`;

        } else {
            alert('Please select a Bank and language');
        }
    });
</script>

</body>
</html>
